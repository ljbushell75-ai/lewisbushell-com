<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lewis Bushell</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Manrope, sans-serif;
            margin: 60px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 40px;
        }

        p {

        }

        .words {
            display: flex;

        .gallery {

            gap: 20px;
        }

        .gallery img {
            max-width: 600px;
            height: auto;
        }

</head>

<body>

<div class="container">

    <h1>LEWIS BUSHELL</h1>

    <div class="words">
        <p>Architecture</p>
        <p>Photography</p>
        <p>About</p>
    </div>

    <p>NOT DONE YET.</p>

    <div class="gallery">
        <img src="5.2.jpg" alt="Photo 1">
        <img src="6.jpg" alt="Photo 2">
        <img src="7.jpg" alt="Photo 3">
    </div>

</div>

</body>

</html>
